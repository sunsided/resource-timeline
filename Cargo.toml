[package]
name = "resource-timeline"
description = "Resource timelines for onboard scheduling: energy, memory, thermal and communication budgets with explained violations, envelopes and allocation-free storage"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/resource-timeline"
homepage = "https://sunsided.github.io/planning-and-search/crates/resource-timeline/"
readme = "README.md"
keywords = ["scheduling", "resources", "spacecraft", "onboard", "timeline"]
categories = ["aerospace", "game-development", "embedded", "no-std", "no-std::no-alloc"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[features]
default = ["alloc"]
## Heap storage, envelopes and the greedy scheduler. Without it the crate needs no allocator.
alloc = ["serde?/alloc"]
## Serialize and Deserialize for the plain data types, timelines and profiles (deserializing
## timelines and profiles also needs `alloc`).
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
serde_json = "1.0.149"
# Only for the bridge example.
temporal-control = "0.1"

[[bench]]
name = "timeline"
harness = false
required-features = ["alloc"]

[[bench]]
name = "site"
harness = false
required-features = ["alloc"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["alloc"]

[[test]]
name = "no_alloc"
path = "tests/no_alloc.rs"

[[example]]
name = "rover"
required-features = ["alloc"]

[[example]]
name = "colony"
required-features = ["alloc"]

[[example]]
name = "rush"
required-features = ["alloc"]

[[example]]
name = "therapy_group"
required-features = ["alloc"]

[[example]]
name = "stn_bridge"
required-features = ["alloc"]

[[example]]
name = "relay"
required-features = ["alloc"]

[[example]]
name = "site"
required-features = ["alloc"]
