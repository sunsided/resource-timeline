[package]
name = "resource-timeline"
description = "Resource timelines for onboard scheduling: energy, memory, thermal and communication budgets"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/resource-timeline"
readme = "README.md"
keywords = ["scheduling", "resources", "spacecraft", "timeline", "planning"]
categories = ["aerospace", "algorithms", "no-std"]

[dependencies]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

[[bench]]
name = "timeline"
harness = false
